name: Build Holo Music Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        items: platform-tools,platforms;android-34,build-tools;34.0.0

    - name: Build with Gradle Directly
      run: |
        gradle assembleDebug

    - name: Sign and Package APK
      run: |
        mkdir -p signed_apk
        cp app/build/outputs/apk/debug/app-debug.apk signed_apk/HoloMusicPlayer-Debug.apk || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HoloMusicPlayer-APK
        path: |
          signed_apk/*.apk
          app/build/outputs/apk/debug/*.apk
