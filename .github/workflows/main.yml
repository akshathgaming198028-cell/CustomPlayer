name: Build Holo Music Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Manually
      run: |
        echo "Setting up Android SDK environment..."
        mkdir -p $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        
        # Set environment variables
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

    - name: Accept Licenses and Install Build Tools
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Build with Gradle
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        gradle assembleDebug

    - name: Sign and Package APK
      run: |
        mkdir -p signed_apk
        cp app/build/outputs/apk/debug/app-debug.apk signed_apk/HoloMusicPlayer-Debug.apk || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HoloMusicPlayer-APK
        path: |
          signed_apk/*.apk
          app/build/outputs/apk/debug/*.apk
